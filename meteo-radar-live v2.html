<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meteo & Radar (dati reali)</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f8;--card:#fff;--tx:#14263a;--mu:#62768b;--ac:#2a6496;--ln:#d8e2ec;--sea:#cfe3f3;--land:#8fb56e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1824;--card:#16253a;--tx:#e8f0f8;--mu:#8ea4ba;--ac:#6fb1ea;--ln:#25384f;--sea:#12304d;--land:#3f6a3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1824;--card:#16253a;--tx:#e8f0f8;--mu:#8ea4ba;--ac:#6fb1ea;--ln:#25384f;--sea:#12304d;--land:#3f6a3a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.4 Figtree,system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px 14px 28px}
h1{font-size:15px;font-weight:600;color:var(--mu);margin:0 0 2px}
.now{display:flex;align-items:baseline;gap:10px}
.now b{font-size:54px;font-weight:800;line-height:1}
.now span{font-size:20px;font-weight:600}
.sub{color:var(--mu);margin:2px 0 12px}
.map{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--ln);background:var(--sea)}
canvas{display:block;width:100%;height:auto;touch-action:manipulation}
.badge{position:absolute;left:10px;top:10px;background:var(--card);padding:4px 10px;border-radius:12px;font-weight:600;font-size:14px}
.seg{display:flex;gap:6px;margin:12px 0 8px}
.seg button,.chips button{flex:1;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:14px;padding:9px 4px;font:600 14px Figtree,system-ui,sans-serif;cursor:pointer}
.seg button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tl{display:flex;align-items:center;gap:10px;margin:8px 0}
.tl button{width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:16px;cursor:pointer;flex:none}
.tl input{flex:1;accent-color:var(--ac)}
.leg{height:8px;border-radius:4px;margin:4px 0 2px}
.legt{display:flex;justify-content:space-between;color:var(--mu);font-size:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px}
.chips button{flex:none;padding:8px 14px}
.days{background:var(--card);border-radius:20px;border:1px solid var(--ln);margin-top:10px}
.day{display:grid;grid-template-columns:78px 36px 1fr auto;align-items:center;gap:8px;padding:12px 14px}
.day+.day{border-top:1px solid var(--ln)}
.day i{font-style:normal;font-size:24px}
.day em{font-style:normal;color:var(--mu);font-size:14px}
.day b{font-weight:800}
.note{color:var(--mu);font-size:12px;margin-top:14px}
.find{display:flex;gap:6px;margin:0 0 6px}
.find input{flex:1;min-width:0;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:14px;padding:10px 12px;font:400 16px Figtree,system-ui,sans-serif}
.find button{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:14px;padding:0 14px;font:600 14px Figtree,system-ui,sans-serif;min-height:44px;cursor:pointer}
.res{display:flex;flex-direction:column;gap:4px}
.res button{text-align:left;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 12px;font:400 15px Figtree,system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1 id="city">Roma</h1>
  <div class="now"><b id="temp">–</b><span id="desc"></span></div>
  <p class="sub" id="when"></p>

  <div class="find"><input id="q" type="search" placeholder="Cerca una città" aria-label="Cerca una città" enterkeyhint="search"><button id="go">Cerca</button><button id="gps" aria-label="Usa la mia posizione">📍</button></div>
  <div class="res" id="res"></div>
  <p class="note" id="msg" aria-live="polite" style="margin:6px 0 10px"></p>
  <div class="map">
    <canvas id="cv" width="680" height="800" aria-label="Mappa radar meteo dell’Italia"></canvas>
    <div class="badge" id="badge"></div>
  </div>

  <div class="seg" id="layers" role="group" aria-label="Livello mappa">
    <button data-l="rain" aria-pressed="true">Pioggia</button>
    <button data-l="cloud" aria-pressed="false">Nuvole</button>
    <button data-l="temp" aria-pressed="false">Temperature</button>
  </div>
  <div class="leg" id="leg"></div>
  <div class="legt"><span id="l0"></span><span id="l1"></span></div>

  <div class="seg" id="dayseg" role="group" aria-label="Giorno"></div>
  <div class="tl">
    <button id="play" aria-label="Avvia animazione">▶</button>
    <input id="sl" type="range" min="0" max="95" value="0" aria-label="Ora della previsione">
  </div>

  <div class="chips" id="cities" role="group" aria-label="Città"></div>
  <div class="days" id="days"></div>
  <p class="note" id="src">Carico i dati meteo…</p>
</main>
<script>
const $=id=>document.getElementById(id);
const LON=[6,19],LAT=[36,47.5],W=680,H=800;
const px=(lo,la)=>[(lo-LON[0])/(LON[1]-LON[0])*W,(LAT[1]-la)/(LAT[1]-LAT[0])*H];
const SHAPES=[
 [[7,45.1],[7,43.8],[8.5,44.1],[9.8,44.1],[10.5,43],[11.1,42.4],[12.2,41.8],[13,41.2],[14.2,40.8],[15,40.1],[15.7,39.9],[16.1,38.9],[15.7,38],[16.5,38.4],[17.1,39],[16.5,39.6],[17.2,40.5],[18.5,40.1],[17.9,40.7],[16.8,41.1],[16,41.9],[15,42.1],[14,42.6],[13.6,43.6],[12.5,44],[12.3,45],[13.5,45.6],[13.8,45.7],[13.7,46.5],[12.4,46.7],[10.5,46.9],[9,46],[7.9,45.9]],
 [[12.4,37.8],[15.6,38.2],[15.1,36.7],[12.6,37.5]],
 [[8.2,41],[9.7,41.1],[9.6,39.2],[8.5,39]]];
const CITIES=[["Roma",12.5,41.9],["Milano",9.19,45.46],["Torino",7.68,45.07],["Venezia",12.33,45.44],["Genova",8.93,44.41],["Bologna",11.34,44.49],["Firenze",11.25,43.77],["Napoli",14.27,40.85],["Bari",16.87,41.12],["Palermo",13.36,38.12],["Cagliari",9.11,39.22]];
let layer="rain",t=0,sel=0,timer=null;
const start=new Date();start.setMinutes(0,0,0);

// rumore deterministico
function h(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 return h(xi,yi)*(1-u)*(1-v)+h(xi+1,yi)*u*(1-v)+h(xi,yi+1)*(1-u)*v+h(xi+1,yi+1)*u*v}
function fbm(x,y){return vn(x,y)*.55+vn(x*2.1,y*2.1)*.3+vn(x*4.3,y*4.3)*.15}
// "previsione" simulata: nuvolosità, pioggia (mm/h), temperatura (°C)
function simSample(lo,la,tt){
 const d=tt*.045,x=lo*.55-d*1.4,y=la*.55+d*.5;
 const cloud=Math.min(1,Math.max(0,(fbm(x,y)-.25)*1.7));
 const rain=Math.max(0,cloud-.68)*22*(.6+fbm(x*3,y*3));
 const hour=(start.getHours()+tt)%24;
 const temp=23-(la-36)*.95+4.5*Math.sin((hour-9)/24*6.283)-cloud*3+(fbm(x+9,y)-.5)*6-(rain>0?2:0);
 return{cloud,rain,temp};
}
let LIVE=null;const PTS=[],NB=new Map();
CITIES.forEach(([n,lo,la])=>PTS.push([lo,la]));
for(let i=0;i<7;i++)for(let j=0;j<9;j++)PTS.push([6.5+i*2,36.5+j*1.3]);
const ROME=+new Intl.DateTimeFormat("it-IT",{timeZone:"Europe/Rome",hour:"numeric",hourCycle:"h23"}).format(new Date());
async function load(){
 try{
  const u="https://api.open-meteo.com/v1/forecast?latitude="+PTS.map(p=>p[1].toFixed(2)).join(",")+"&longitude="+PTS.map(p=>p[0].toFixed(2)).join(",")+"&hourly=temperature_2m,precipitation,cloud_cover&forecast_days=5&timezone=Europe%2FRome";
  const r=await fetch(u);if(!r.ok)throw 0;let j=await r.json();if(!Array.isArray(j))j=[j];
  LIVE=j.map(x=>({T:x.hourly.temperature_2m,R:x.hourly.precipitation,C:x.hourly.cloud_cover}));
  $("src").textContent="Dati reali da Open-Meteo.com, interpolati tra i punti della griglia (non è un radar vero).";
 }catch(e){$("src").textContent="Servizio meteo non raggiungibile: mostro dati dimostrativi."}
 update();
}
function sample(lo,la,tt){
 if(!LIVE)return simSample(lo,la,tt);
 const key=lo.toFixed(3)+","+la.toFixed(3);let nb=NB.get(key);
 if(!nb){nb=PTS.map((p,k)=>[(p[0]-lo)**2*.55+(p[1]-la)**2,k]).sort((a,b)=>a[0]-b[0]).slice(0,4).map(([d,k])=>[k,1/(d+.01)]);NB.set(key,nb)}
 const i=Math.min(119,ROME+tt);let w=0,T=0,R=0,C=0;
 for(const[k,x]of nb){const d=LIVE[k];if(!d)continue;w+=x;T+=d.T[i]*x;R+=d.R[i]*x;C+=d.C[i]*x}
 return{cloud:C/w/100,rain:R/w,temp:T/w};
}
const RAINC=[[.1,[120,200,255,150]],[1,[50,130,240,200]],[3,[30,200,90,215]],[7,[245,220,40,225]],[14,[240,60,50,235]]];
function rainColor(r){let c=null;for(const [m,col] of RAINC)if(r>=m)c=col;return c}
function tempColor(T){const k=Math.max(0,Math.min(1,(T-2)/28)),st=[[90,120,230],[80,190,230],[110,210,120],[250,220,70],[245,130,50],[220,50,50]],i=k*5,a=st[Math.floor(i)],b=st[Math.min(5,Math.floor(i)+1)],f=i%1;
 return a.map((v,j)=>Math.round(v+(b[j]-v)*f))}
function icon(s){return s.rain>2?"🌧️":s.rain>.3?"🌦️":s.cloud>.7?"☁️":s.cloud>.4?"⛅":"☀️"}
function txt(s){return s.rain>2?"Pioggia":s.rain>.3?"Rovesci":s.cloud>.7?"Nuvoloso":s.cloud>.4?"Poco nuvoloso":"Sereno"}

const cv=$("cv"),ctx=cv.getContext("2d"),off=document.createElement("canvas"),GW=85,GH=100;
off.width=GW;off.height=GH;const octx=off.getContext("2d");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function draw(){
 ctx.fillStyle=css("--sea");ctx.fillRect(0,0,W,H);
 ctx.fillStyle=css("--land");
 const path=()=>{for(const s of SHAPES){s.forEach(([lo,la],i)=>{const[p,q]=px(lo,la);i?ctx.lineTo(p,q):(ctx.beginPath(),ctx.moveTo(p,q))});ctx.closePath();}};
 SHAPES.forEach(s=>{ctx.beginPath();s.forEach(([lo,la],i)=>{const[p,q]=px(lo,la);i?ctx.lineTo(p,q):ctx.moveTo(p,q)});ctx.closePath();ctx.fill()});
 const im=octx.createImageData(GW,GH),d=im.data;
 for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){
  const lo=LON[0]+(i+.5)/GW*(LON[1]-LON[0]),la=LAT[1]-(j+.5)/GH*(LAT[1]-LAT[0]),s=sample(lo,la,t);let c=[0,0,0,0];
  if(layer==="rain"){const r=rainColor(s.rain);if(r)c=r;else c=[255,255,255,Math.round(s.cloud*70)]}
  else if(layer==="cloud")c=[255,255,255,Math.round(Math.pow(s.cloud,1.3)*215)];
  else c=[...tempColor(s.temp),150];
  const o=(j*GW+i)*4;d[o]=c[0];d[o+1]=c[1];d[o+2]=c[2];d[o+3]=c[3]}
 octx.putImageData(im,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";ctx.drawImage(off,0,0,W,H);
 ctx.strokeStyle="rgba(20,50,80,.55)";ctx.lineWidth=2;
 SHAPES.forEach(s=>{ctx.beginPath();s.forEach(([lo,la],i)=>{const[p,q]=px(lo,la);i?ctx.lineTo(p,q):ctx.moveTo(p,q)});ctx.closePath();ctx.stroke()});
 ctx.font="700 22px Figtree,system-ui,sans-serif";ctx.textAlign="center";
 CITIES.forEach(([n,lo,la],i)=>{const[p,q]=px(lo,la),s=sample(lo,la,t);
  ctx.beginPath();ctx.arc(p,q,i===sel?9:6,0,7);ctx.fillStyle=i===sel?"#2a6496":"#fff";ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="#14263a";ctx.stroke();
  ctx.lineWidth=5;ctx.strokeStyle="rgba(255,255,255,.9)";ctx.fillStyle="#14263a";const lab=n+" "+Math.round(s.temp)+"°";
  ctx.strokeText(lab,p,q-14);ctx.fillText(lab,p,q-14)});
}
function fmt(tt){const d=new Date(start.getTime()+tt*36e5);return d.toLocaleDateString("it-IT",{weekday:"long"})+" "+String(d.getHours()).padStart(2,"0")+":00"}
function update(){
 const[n,lo,la]=CITIES[sel],s=sample(lo,la,t);
 $("city").textContent=n;$("temp").textContent=Math.round(s.temp)+"°";$("desc").textContent=icon(s)+" "+txt(s);
 $("when").textContent=fmt(t).replace(/^./,c=>c.toUpperCase())+" · pioggia "+s.rain.toFixed(1)+" mm/h";
 $("badge").textContent=fmt(t).replace(/^./,c=>c.toUpperCase());$("sl").value=t;
 document.querySelectorAll("#dayseg button").forEach((b,i)=>b.setAttribute("aria-pressed",Math.floor(t/24)===i));
 draw();forecast();
}
function forecast(){
 const[n,lo,la]=CITIES[sel];let html="";
 for(let k=0;k<4;k++){let mx=-99,mn=99,rn=0,cl=0;
  for(let hh=0;hh<24;hh++){const s=sample(lo,la,k*24+hh);mx=Math.max(mx,s.temp);mn=Math.min(mn,s.temp);rn+=s.rain;cl+=s.cloud}
  const m=sample(lo,la,k*24+12);m.rain=rn/24*1.6;m.cloud=cl/24;
  const dt=new Date(start.getTime()+k*864e5),nm=k===0?"Oggi":k===1?"Domani":dt.toLocaleDateString("it-IT",{weekday:"long"}).replace(/^./,c=>c.toUpperCase());
  html+=`<div class="day"><b>${nm}</b><i>${icon(m)}</i><em>${rn>.5?rn.toFixed(0)+" mm":txt(m)}</em><span><b>${Math.round(mx)}°</b> <em>${Math.round(mn)}°</em></span></div>`}
 $("days").innerHTML=html;
}
// controlli
$("layers").onclick=e=>{const b=e.target.closest("button");if(!b)return;layer=b.dataset.l;
 document.querySelectorAll("#layers button").forEach(x=>x.setAttribute("aria-pressed",x===b));legend();update()};
function legend(){const L=$("leg");
 if(layer==="rain"){L.style.background="linear-gradient(90deg,rgb(120,200,255),rgb(50,130,240),rgb(30,200,90),rgb(245,220,40),rgb(240,60,50))";$("l0").textContent="Debole";$("l1").textContent="Intensa"}
 else if(layer==="temp"){L.style.background="linear-gradient(90deg,rgb(90,120,230),rgb(80,190,230),rgb(110,210,120),rgb(250,220,70),rgb(245,130,50),rgb(220,50,50))";$("l0").textContent="2 °C";$("l1").textContent="30 °C"}
 else{L.style.background="linear-gradient(90deg,transparent,#fff)";L.style.border="1px solid var(--ln)";$("l0").textContent="Sereno";$("l1").textContent="Coperto"}
 if(layer!=="cloud")L.style.border="0"}
for(let k=0;k<4;k++){const b=document.createElement("button"),dt=new Date(start.getTime()+k*864e5);
 b.textContent=k===0?"Oggi":k===1?"Domani":dt.toLocaleDateString("it-IT",{weekday:"short"});
 b.onclick=()=>{stop();t=k===0?0:k*24+12;update()};$("dayseg").appendChild(b)}
CITIES.forEach(([n],i)=>{const b=document.createElement("button");b.textContent=n;b.setAttribute("aria-pressed",i===sel);
 b.onclick=()=>{sel=i;document.querySelectorAll("#cities button").forEach((x,j)=>x.setAttribute("aria-pressed",j===i));update()};$("cities").appendChild(b)});
$("sl").oninput=e=>{stop();t=+e.target.value;update()};
function stop(){if(timer){clearInterval(timer);timer=null;$("play").textContent="▶"}}
$("play").onclick=()=>{if(timer)return stop();$("play").textContent="❚❚";
 timer=setInterval(()=>{t=(t+1)%96;update()},260)};
cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;let best=-1,bd=60*60;
 CITIES.forEach(([n,lo,la],i)=>{const[p,q]=px(lo,la),dd=(p-x)**2+(q-y)**2;if(dd<bd){bd=dd;best=i}});
 if(best>=0)$("cities").children[best].click()};
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>draw());

const API=(la,lo)=>"https://api.open-meteo.com/v1/forecast?latitude="+la+"&longitude="+lo+"&hourly=temperature_2m,precipitation,cloud_cover&forecast_days=5&timezone=Europe%2FRome";
function msg(t){$("msg").textContent=t}
function pick(i){sel=i;document.querySelectorAll("#cities button").forEach((x,j)=>x.setAttribute("aria-pressed",j===i));update()}
async function addPlace(name,lo,la){
 if(!LIVE){msg("Per aggiungere un luogo servono i dati reali: controlla la connessione.");return}
 msg("Carico "+name+"…");
 try{
  const r=await fetch(API(la.toFixed(2),lo.toFixed(2)));if(!r.ok)throw 0;const x=(await r.json()).hourly;
  const d={T:x.temperature_2m,R:x.precipitation,C:x.cloud_cover};
  let i=CITIES.findIndex(c=>c[0]===name);
  if(i<0){
   CITIES.push([name,lo,la]);PTS.push([lo,la]);LIVE.push(d);i=CITIES.length-1;
   const idx=i,b=document.createElement("button");b.textContent=name;b.setAttribute("aria-pressed","false");
   b.onclick=()=>pick(idx);$("cities").appendChild(b);
  }else{
   const k=PTS.findIndex(p=>p[0]===CITIES[i][1]&&p[1]===CITIES[i][2]);
   CITIES[i][1]=lo;CITIES[i][2]=la;if(k>=0){PTS[k]=[lo,la];LIVE[k]=d}
  }
  NB.clear();pick(i);msg("");
  $("cities").children[i].scrollIntoView({inline:"center",block:"nearest"});
 }catch(e){msg("Impossibile caricare "+name+".")}
}
async function search(){
 const q=$("q").value.trim();if(q.length<2)return;
 msg("Cerco…");$("res").innerHTML="";
 try{
  const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=5&language=it");
  const j=await r.json();
  if(!j.results){msg("Nessun risultato per “"+q+"”.");return}
  msg("");
  j.results.forEach(p=>{const b=document.createElement("button");
   b.textContent=[p.name,p.admin1,p.country].filter(Boolean).join(", ");
   b.onclick=()=>{$("res").innerHTML="";$("q").value="";addPlace(p.name,p.longitude,p.latitude)};
   $("res").appendChild(b)});
 }catch(e){msg("Ricerca non disponibile: controlla la connessione.")}
}
function gps(){
 if(!navigator.geolocation){msg("Posizione non disponibile su questo browser.");return}
 msg("Cerco la tua posizione…");
 navigator.geolocation.getCurrentPosition(p=>addPlace("La mia posizione",p.coords.longitude,p.coords.latitude),
  ()=>msg("Posizione non consentita: abilitala nelle impostazioni del browser."),{timeout:10000});
}
$("go").onclick=search;$("q").onkeydown=e=>{if(e.key==="Enter")search()};$("gps").onclick=gps;
legend();update();load();
</script>
</body>
</html>
